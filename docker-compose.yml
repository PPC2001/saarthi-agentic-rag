# ==============================================================================
# Local Development Stack — Insurance RAG Platform
# Runs FastAPI App + Qdrant Vector DB + Redis Semantic Cache
# ==============================================================================

version: '3.8'

services:
  # ── FastAPI RAG Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=DEV
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped

  # ── Qdrant Vector Database ──
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: insurance-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rag-network
    restart: unless-stopped

  # ── Redis (Semantic Query Cache) ──
  redis:
    image: redis:7.2-alpine
    container_name: insurance-rag-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rag-network
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local

networks:
  rag-network:
    driver: bridge
