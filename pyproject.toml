[project]
name = "saarthi-ai"
version = "0.1.0"
description = "Saarthi AI — Life Insurance Assistant Agentic RAG Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Pratik Chavan", email = "pratik@capitalnumbers.com" }
]

dependencies = [
    # ── API Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    # ── LLM Orchestration ──
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    # ── LLM Gateway ──
    "portkey-ai>=1.9.0",
    # ── AWS SDK ──
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",
    # ── Vector Database & Local Embeddings ──
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    # ── Document Processing ──
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    # ── Caching ──
    "redis>=5.1.0",
    # ── Observability ──
    "structlog>=24.4.0",
    "logfire[fastapi,httpx,redis]>=2.0.0",
    # ── Utilities ──
    "pytz>=2024.1",
    "tenacity>=9.0.0",
    "streamlit>=1.64.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "guardrails-ai>=0.11.0",
    # ── Cross-Encoder Reranker ──
    "flashrank>=0.2.0",
    # ── Prometheus Metrics ──
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Could not obtain an event loop.*:UserWarning",
    "ignore:.*is deprecated and will be removed in Click 9.0.*:DeprecationWarning",
    "ignore:.*The 'is_flag' and 'flag_value' parameters are not supported by Typer.*:DeprecationWarning",
    "ignore:.*model_dump.*:DeprecationWarning",
    "ignore:.*Extra data.*:UserWarning",
]

[tool.logfire]
ignore_no_config = true
